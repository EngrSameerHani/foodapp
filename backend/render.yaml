services:
  - type: web
    name: zawadi-food-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zawadi-food-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: OTP_EXPIRE_SECONDS
        value: "300"
      - key: OTP_MAX_ATTEMPTS
        value: "3"
      - key: OTP_RATE_LIMIT_WINDOW_SECONDS
        value: "600"
      - key: OTP_RATE_LIMIT_MAX_REQUESTS
        value: "3"
      - key: EXPO_PUSH_URL
        value: https://exp.host/--/api/v2/push/send
      - key: PER_KM_RATE
        value: "0.50"
      - key: SERVICE_FEE
        value: "1.99"
      - key: TAX_RATE
        value: "0.08"
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: MEDIA_DIR
        value: ./media
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: zawadi-food-db
    databaseName: zawadi_food
    user: zawadi
    plan: free
