name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile-frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'
        type: choice
        options:
          - preview
          - preview-mock

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        working-directory: mobile-frontend
        run: npm install --legacy-peer-deps

      - name: Build APK
        working-directory: mobile-frontend
        env:
          EAS_NO_VCS: 1
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait

      - name: Done
        run: |
          echo "=========================================="
          echo "✅ Build submitted!"
          echo "📱 Download APK at:"
          echo "https://expo.dev/accounts/sameer-hani/projects/zawadi-food-mobile/builds"
          echo "=========================================="
