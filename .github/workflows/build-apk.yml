name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile-frontend/**'
  workflow_dispatch:   # also allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build APK (preview-mock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        working-directory: mobile-frontend
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: mobile-frontend
        run: eas build --platform android --profile preview-mock --non-interactive

      - name: Print download link
        run: echo "✅ Build complete — download APK from https://expo.dev/accounts/sameer-hani/projects/zawadi-food-mobile/builds"
