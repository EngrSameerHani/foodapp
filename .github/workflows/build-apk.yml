name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile-frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK (preview-mock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        working-directory: mobile-frontend
        run: npm install --legacy-peer-deps

      - name: Build APK
        working-directory: mobile-frontend
        env:
          EAS_NO_VCS: 1
        run: eas build --platform android --profile preview-mock --non-interactive --no-wait

      - name: APK Ready
        run: |
          echo "=========================================="
          echo "Build submitted! Download APK in 10-15 min:"
          echo "https://expo.dev/accounts/sameer-hani/projects/zawadi-food-mobile/builds"
          echo "=========================================="
