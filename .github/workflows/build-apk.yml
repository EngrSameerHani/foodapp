name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile-frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK (preview-mock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mobile-frontend
        run: npm install --legacy-peer-deps

      - name: Install EAS CLI globally
        run: npm install -g eas-cli@latest

      - name: Verify token and project config
        working-directory: mobile-frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "EAS CLI version:"
          eas --version
          echo "Expo project config:"
          npx expo config --type public 2>&1 || true

      - name: Build Android APK
        working-directory: mobile-frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview-mock --non-interactive --no-wait

      - name: Done
        run: |
          echo "=========================================="
          echo "✅ Build submitted to EAS cloud servers!"
          echo "📱 Download APK (ready in ~10-15 min) at:"
          echo "https://expo.dev/accounts/sameer-hani/projects/zawadi-food-mobile/builds"
          echo "=========================================="
